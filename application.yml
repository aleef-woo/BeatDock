server:
  port: 2333
  address: 0.0.0.0
  undertow:
    threads:
      io: 4
      worker: 8

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # The VPS egress IP is flagged by YouTube ("Sign in to confirm you're not a bot"),
    # which no client mix or poToken clears. OAuth signs the requests as a real account.
    # First boot logs a device code to link; paste the resulting refresh token below so
    # restarts skip the flow. Use a throwaway Google account -- YouTube bans for this.
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
      skipInitialization: ${YOUTUBE_SKIP_OAUTH_INIT:false}
    clients:
      - MUSIC             # ytmsearch / music catalog (metadata only, no playback)
      - TV                # only client that uses the OAuth token; playback only, no metadata
      - TVHTML5_SIMPLY    # opus, no poToken, no cipher script; credential-free fallback
      - ANDROID_MUSIC     # opus fallback, credential-free
      - WEB               # arbitrary videos + RD mixes (needs poToken, pushed by pot-refresher)
      - WEBEMBEDDED       # embed / age-limited fallback (also uses poToken)
      - MWEB              # mobile web fallback
      - ANDROID_VR        # credential-free safety net if the poToken is momentarily unavailable
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
      - "spsearch:%QUERY%"
    sources:
      spotify: ${SPOTIFY_ENABLED:false}
      youtube: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "US"
      playlistLoadLimit: 3
      albumLoadLimit: 3

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.1"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: false
      local: false
    bufferDurationMs: 200
    frameBufferDurationMs: 1000
    youtubePlaylistLoadLimit: 3
    playerUpdateInterval: 2
    trackStuckThresholdMs: 5000
    useSeekGhosting: true
    ratelimit:
      ipBlocks: []
      excludedIps: []
      strategy: "RotateOnBan"
      searchTriggersFail: true
      retryLimit: 5
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      rotation: true
      lowpass: true

logging:
  level:
    root: INFO
    lavalink: INFO
  logback:
    rollingpolicy:
      max-history: 3
      max-file-size: 10MB
